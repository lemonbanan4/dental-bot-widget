<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clinic Dashboard | Lemon Techno</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* --- LAYOUT --- */
    .navbar { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 800; font-size: 1.25rem; color: #0f172a; display: flex; align-items: center; gap: 8px; }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

    /* --- CARDS --- */
    .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .stat-label { color: #64748b; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
    .stat-value { color: #0f172a; font-size: 2rem; font-weight: 800; }

    /* --- TABLE --- */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th { text-align: left; padding: 12px 16px; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 16px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge.new { background: #dcfce7; color: #166534; }
    .badge.contacted { background: #f1f5f9; color: #475569; }

    /* --- LOGIN FORM --- */
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f0fdfa, #ffffff); }
    .login-card { width: 100%; max-width: 400px; text-align: center; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 500; color: #334155; }
    .input-field { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    .btn { background: #0d9488; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn:hover { background: #0f766e; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; width: auto; padding: 8px 16px; font-size: 0.9rem; }

    /* --- TABS --- */
    .tabs { display: flex; gap: 24px; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { background: none; border: none; padding: 12px 0; font-size: 1rem; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { color: #0d9488; border-bottom-color: #0d9488; }
    .tab-btn:hover { color: #0f172a; }

    /* --- PRINT --- */
    @media print {
      @page { margin: 1cm; }
      .navbar, .tabs, .stats-grid, #login-view, #view-settings { display: none !important; }
      body, .container, .card { background: white; margin: 0; padding: 0; box-shadow: none; border: none; max-width: 100%; width: 100%; }
      .card > div:first-child > div { display: none !important; } /* Hide filters */
      th:last-child, td:last-child { display: none; } /* Hide Action column */
      textarea { border: none; resize: none; overflow: visible; height: auto !important; }
      table { border: 1px solid #e2e8f0; }
      th, td { border: 1px solid #e2e8f0; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="login-wrapper">
    <div class="card login-card">
      <div style="font-size: 3rem; margin-bottom: 10px;">🍋</div>
      <h1 style="margin: 0 0 24px 0; font-size: 1.5rem;">Clinic Login</h1>
      <form id="login-form">
        <div class="input-group">
          <label>Clinic ID</label>
          <input type="text" id="clinic-id" class="input-field" placeholder="e.g. smile-city-001" required>
        </div>
        <div class="input-group">
          <label>Access Key</label>
          <input type="password" id="api-key" class="input-field" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Access Dashboard</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="hidden">
    <nav class="navbar">
      <div class="brand"><span>🍋</span> <span id="nav-clinic-name">Clinic Dashboard</span></div>
      <button id="logout-btn" class="btn btn-outline">Log Out</button>
    </nav>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="leads">Leads</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>

      <!-- VIEW: LEADS -->
      <div id="view-leads">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Leads</div>
            <div class="stat-value" id="stat-total">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">This Week</div>
            <div class="stat-value" id="stat-week">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Conversion Rate</div>
            <div class="stat-value">12%</div>
          </div>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin: 0; font-size: 1.25rem;">Recent Inquiries</h2>
            <div style="display:flex; gap:10px; align-items:center;">
              <input type="date" id="date-start" class="input-field" style="padding: 6px 12px; font-size: 0.85rem; width: 130px;" title="Start Date">
              <span style="color:#cbd5e1">–</span>
              <input type="date" id="date-end" class="input-field" style="padding: 6px 12px; font-size: 0.85rem; width: 130px;" title="End Date">
              <input type="text" id="search-input" class="input-field" placeholder="Search name or email..." style="padding: 6px 12px; font-size: 0.85rem; width: 200px;">
              <button id="export-btn" class="btn btn-outline" style="font-size: 0.85rem; padding: 6px 12px;">Export CSV</button>
              <button id="print-btn" class="btn btn-outline" style="font-size: 0.85rem; padding: 6px 12px;">Print</button>
              <button id="refresh-btn" class="btn btn-outline" style="font-size: 0.85rem; padding: 6px 12px;" title="Refresh Data">🔄</button>
            </div>
          </div>
          <div class="table-container">
            <table id="leads-table">
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Name</th>
                  <th>Contact</th>
                  <th>Message</th>
                  <th>Source</th>
                  <th>Notes</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <!-- Rows injected by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- VIEW: SETTINGS -->
      <div id="view-settings" class="hidden">
        <div class="card" style="max-width: 600px;">
          <h2 style="margin-top: 0; margin-bottom: 24px; font-size: 1.25rem;">Clinic Settings</h2>
          <form id="settings-form">
            <div class="input-group">
              <label>Weekdays (Mon-Fri)</label>
              <input type="text" id="hours-weekdays" class="input-field" placeholder="e.g. 9:00 AM - 6:00 PM">
            </div>
            <div class="input-group">
              <label>Weekends</label>
              <input type="text" id="hours-weekends" class="input-field" placeholder="e.g. 10:00 AM - 4:00 PM">
            </div>
            <button type="submit" class="btn" style="width: auto;">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://dental-bot-api.onrender.com";
  let currentLeads = [];

  // --- STATE MANAGEMENT ---
  const loginView = document.getElementById('login-view');
  const dashView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const logoutBtn = document.getElementById('logout-btn');

  function checkAuth() {
    const clinicId = localStorage.getItem('dbot_dash_clinic');
    if (clinicId) {
      showDashboard(clinicId);
    } else {
      showLogin();
    }
  }

  function showLogin() {
    loginView.classList.remove('hidden');
    dashView.classList.add('hidden');
  }

  function showDashboard(clinicId) {
    loginView.classList.add('hidden');
    dashView.classList.remove('hidden');
    document.getElementById('nav-clinic-name').textContent = clinicId;
    fetchLeads(clinicId);
    loadSettings(clinicId);
  }

  // --- LOGIC ---
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const clinicId = document.getElementById('clinic-id').value;
    const apiKey = document.getElementById('api-key').value;
    
    // In a real app, verify credentials with API here.
    // For now, we just save locally and proceed.
    localStorage.setItem('dbot_dash_clinic', clinicId);
    localStorage.setItem('dbot_dash_key', apiKey);
    showDashboard(clinicId);
  });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('dbot_dash_clinic');
    localStorage.removeItem('dbot_dash_key');
    showLogin();
  });

  async function fetchLeads(clinicId) {
    const tbody = document.querySelector('#leads-table tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Loading leads...</td></tr>';

    try {
      // Attempt to fetch from API (Assuming an endpoint exists)
      // If this fails, we fall back to DEMO data so you can see the UI.
      const key = localStorage.getItem('dbot_dash_key');
      const res = await fetch(`${API_URL}/admin/leads?clinic_id=${clinicId}`, {
        headers: { 'Authorization': key }
      });
      
      if (!res.ok) throw new Error("API not ready");
      const data = await res.json();
      currentLeads = data;
      renderLeads(data);

    } catch (e) {
      console.warn("Using demo data:", e);
      // DEMO DATA FALLBACK
      const demoData = [
        { name: "Sarah Connor", phone: "555-0199", email: "sarah@example.com", message: "Need to reschedule my cleaning.", source: "Mobile", date: new Date().toISOString(), status: "new" },
        { name: "Kyle Reese", phone: "555-0123", email: "kyle@future.com", message: "Emergency tooth ache.", source: "Desktop", date: new Date(Date.now() - 86400000).toISOString(), status: "contacted" },
        { name: "John Doe", phone: "555-0100", email: "john@doe.com", message: "Do you accept Delta Dental?", source: "Mobile", date: new Date(Date.now() - 172800000).toISOString(), status: "contacted" },
      ];
      currentLeads = demoData;
      renderLeads(demoData);
    }
  }

  function renderLeads(leads) {
    const tbody = document.querySelector('#leads-table tbody');
    tbody.innerHTML = '';
    
    document.getElementById('stat-total').textContent = leads.length;
    document.getElementById('stat-week').textContent = leads.filter(l => new Date(l.date) > new Date(Date.now() - 604800000)).length;

    const clinicId = localStorage.getItem('dbot_dash_clinic');
    const notesStore = JSON.parse(localStorage.getItem(`dbot_notes_${clinicId}`) || '{}');

    leads.forEach((lead) => {
      const tr = document.createElement('tr');
      const dateStr = new Date(lead.date).toLocaleDateString() + ' ' + new Date(lead.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const originalIndex = currentLeads.indexOf(lead);
      const uniqueId = lead.id || (lead.date + (lead.email||'') + (lead.phone||''));
      const noteVal = notesStore[uniqueId] || '';
      
      // Dynamic style for select based on status
      const statusBg = lead.status === 'new' ? '#dcfce7' : (lead.status === 'contacted' ? '#f1f5f9' : '#fff7ed');
      const statusColor = lead.status === 'new' ? '#166534' : (lead.status === 'contacted' ? '#475569' : '#9a3412');

      tr.innerHTML = `
        <td>
          <select onchange="updateStatus(${originalIndex}, this.value)" style="background:${statusBg}; color:${statusColor}; border:1px solid transparent; border-radius:4px; padding:4px 8px; font-size:0.75rem; font-weight:600; cursor:pointer; outline:none;">
            <option value="new" ${lead.status === 'new' ? 'selected' : ''}>New Lead</option>
            <option value="contacted" ${lead.status === 'contacted' ? 'selected' : ''}>Contacted</option>
            <option value="booked" ${lead.status === 'booked' ? 'selected' : ''}>Booked</option>
            <option value="lost" ${lead.status === 'lost' ? 'selected' : ''}>Lost</option>
          </select>
        </td>
        <td><strong>${lead.name || 'Anonymous'}</strong></td>
        <td>
          <div>${lead.phone || '-'}</div>
          <div style="font-size:0.8em; color:#94a3b8">${lead.email || ''}</div>
        </td>
        <td style="max-width: 300px;">${lead.message || '-'}</td>
        <td><span class="badge" style="background:#f8fafc; border:1px solid #e2e8f0; color:#64748b; font-weight:500;">${lead.source || 'Web'}</span></td>
        <td>
          <textarea class="input-field" style="min-height:60px; font-size:0.85rem; padding:6px; width:100%; min-width:150px;" placeholder="Add note..." onchange="saveLeadNote(${originalIndex}, this.value)">${noteVal}</textarea>
        </td>
        <td style="white-space:nowrap; color:#94a3b8">${dateStr}</td>
        <td>
          <button class="btn btn-outline" onclick="deleteLead(${originalIndex})" style="padding:4px 8px; font-size:0.75rem; color:#ef4444; border-color:#ef4444;" title="Delete">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function applyFilters() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const startVal = document.getElementById('date-start').value;
    const endVal = document.getElementById('date-end').value;
    
    const startDate = startVal ? new Date(startVal) : null;
    const endDate = endVal ? new Date(endVal) : null;
    if (endDate) endDate.setHours(23, 59, 59, 999); // Include the full end day

    const filtered = currentLeads.filter(l => {
      const d = new Date(l.date);
      const matchesTerm = !term || (l.name && l.name.toLowerCase().includes(term)) || (l.email && l.email.toLowerCase().includes(term));
      const matchesStart = !startDate || d >= startDate;
      const matchesEnd = !endDate || d <= endDate;
      return matchesTerm && matchesStart && matchesEnd;
    });
    renderLeads(filtered);
  }

  window.updateStatus = function(index, newStatus) {
    if (currentLeads[index]) {
      currentLeads[index].status = newStatus;
      applyFilters();
    }
  };

  window.deleteLead = function(index) {
    if (confirm('Are you sure you want to delete this lead?')) {
      currentLeads.splice(index, 1);
      applyFilters();
    }
  };

  window.saveLeadNote = function(index, value) {
    const lead = currentLeads[index];
    if (!lead) return;
    const uniqueId = lead.id || (lead.date + (lead.email||'') + (lead.phone||''));
    const clinicId = localStorage.getItem('dbot_dash_clinic');
    const storeKey = `dbot_notes_${clinicId}`;
    const notes = JSON.parse(localStorage.getItem(storeKey) || '{}');
    notes[uniqueId] = value;
    localStorage.setItem(storeKey, JSON.stringify(notes));
  };

  // --- TABS & SETTINGS ---
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('view-leads').classList.toggle('hidden', tab !== 'leads');
      document.getElementById('view-settings').classList.toggle('hidden', tab !== 'settings');
    });
  });

  function loadSettings(clinicId) {
    try {
      const raw = localStorage.getItem(`dbot_settings_${clinicId}`);
      if (raw) {
        const data = JSON.parse(raw);
        document.getElementById('hours-weekdays').value = data.weekdays || '';
        document.getElementById('hours-weekends').value = data.weekends || '';
      }
    } catch(e) {}
  }

  document.getElementById('settings-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const clinicId = localStorage.getItem('dbot_dash_clinic');
    const data = {
      weekdays: document.getElementById('hours-weekdays').value,
      weekends: document.getElementById('hours-weekends').value
    };
    localStorage.setItem(`dbot_settings_${clinicId}`, JSON.stringify(data));
    const btn = e.target.querySelector('button');
    const orig = btn.textContent;
    btn.textContent = 'Saved! ✅';
    setTimeout(() => btn.textContent = orig, 2000);
  });

  document.getElementById('export-btn').addEventListener('click', () => {
    if (!currentLeads.length) return;
    const headers = ["Status", "Name", "Phone", "Email", "Message", "Source", "Date"];
    const rows = currentLeads.map(l => [
      l.status,
      `"${(l.name || '').replace(/"/g, '""')}"`,
      l.phone || '',
      l.email || '',
      `"${(l.message || '').replace(/"/g, '""')}"`,
      l.source || 'Web',
      l.date
    ]);
    const csvContent = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `leads_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('date-start').addEventListener('change', applyFilters);
  document.getElementById('date-end').addEventListener('change', applyFilters);

  document.getElementById('print-btn').addEventListener('click', () => window.print());

  document.getElementById('refresh-btn').addEventListener('click', () => {
    const clinicId = localStorage.getItem('dbot_dash_clinic');
    if (clinicId) fetchLeads(clinicId);
  });

  // Init
  checkAuth();
</script>
</body>
</html>
